<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Private AI Setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="setup.css">
<style>
  body { display: flex; height: 100vh; margin: 0; align-items: center; justify-content: center; background: #f9fafb; }
  .container { max-width: 28rem; width: 90%; padding: 2rem; background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
  .logo { text-align: center; margin-bottom: 2rem; }
  .logo img { max-height: 48px; }
  .title { font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; color: #1f2937; }
  .subtitle { text-align: center; color: #6b7280; margin-bottom: 2rem; }
  rem; }
  .input-group { margin-bottom: 1.5rem; .code-input { width: 100%; padding: 0.75rem 1rem; font-size: 1.125rem; letter-spacing: 0.1em; text-transform: uppercase; border: 2px solid #e5e7eb; border-radius: 0.375rem; font-family: monospace; text-align: center; }
  .code-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25); }
  .btn { width: 100%; padding: 0.75rem; background: #4f46e5; color: white; border: none; border-radius: 0.375rem; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #4338ca; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #ef4444; margin-top: 1rem; text-align: center; min-height: 1.5rem; }
  .loading { text-align: center; margin-top: 1rem; color: #6b7280; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <!-- Optional: add your logo here -->
    <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
      <span style="color: white; font-weight: bold;">AI</span>
    </div>
  </div>
  <h1 class="title">Private AI Setup</h1>
  <p class="subtitle">Enter your code to begin setup</p>
  <input type="text" id="codeInput" class="code-input" placeholder="PAI-XXXX-XXXX" autocomplete="off" maxlength="13">
  <button id="submitBtn" class="btn">Continue</button>
  <p id="errorMsg" class="error" hidden></p>
  <p id="loadingMsg" class="loading" hidden>Validating code...</p>
</div>

<script>
  const codeInput = document.getElementById('codeInput');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loadingMsg = document.getElementById('loadingMsg');

  // Backend URL - UPDATE THIS TO YOUR ACTUAL BACKEND
  const BACKEND_URL = 'https://your-backend-domain.com'; // <-- CHANGE THIS

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.hidden = false;
    loadingMsg.hidden = true;
    submitBtn.disabled = false;
  }

  function hideError() {
    errorMsg.hidden = true;
  }

  submitBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if (!code) {
      showError('Please enter your code');
      return;
    }

    // Basic format validation
    const normalized = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!normalized.startsWith('PAI') || normalized.length !== 11) {
      showError('Please enter a valid code (format: PAI-XXXX-XXXX)');
      return;
    }

    hideError();
    submitBtn.disabled = true;
    loadingMsg.hidden = false;

    try {
      const response = await fetch(`${BACKEND_URL}/v1/claim`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ code: code.toUpperCase() })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || 'Invalid code');
      }

      // Code validated successfully
      // Store code in sessionStorage (clears when tab closes)
      sessionStorage.setItem('validatedCode', code.toUpperCase());

      // Redirect to setup page
      window.location.href = 'setup.html';
    } catch (err) {
      showError(err.message || 'Validation failed. Please check your code and try again.');
    } finally {
      submitBtn.disabled = false;
      loadingMsg.hidden = true;
    }
  });

  // Allow Enter key to submit
  codeInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      submitBtn.click();
    }
  });

  // Focus on input when page loads
  codeInput.focus();
</script>
</body>
</html>
