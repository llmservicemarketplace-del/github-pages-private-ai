<svg xmlns="http://www.w3.org/2000/svg" width="760" height="165" viewBox="0 0 760 165" role="img" aria-labelledby="title desc"><title id="title">Rebuild or Relocate process</title><desc id="desc">A four-step illustration: Facts, Rebuild, Relocate, Review.</desc><rect width="760" height="165" rx="16" fill="#f8fafc"/><rect x="35" y="38" width="135" height="88" rx="12" fill="#1e3a8a"/><text x="102.5" y="78" text-anchor="middle" fill="#fff" font-size="17" font-family="Arial, sans-serif" font-weight="700">Facts</text><text x="102.5" y="102" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">Step 1</text><path d="M170 82h34" stroke="#64748b" stroke-width="4"/><path d="m196 72 12 10-12 10" fill="none" stroke="#64748b" stroke-width="4"/><rect x="215" y="38" width="135" height="88" rx="12" fill="#0369a1"/><text x="282.5" y="78" text-anchor="middle" fill="#fff" font-size="17" font-family="Arial, sans-serif" font-weight="700">Rebuild</text><text x="282.5" y="102" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">Step 2</text><path d="M350 82h34" stroke="#64748b" stroke-width="4"/><path d="m376 72 12 10-12 10" fill="none" stroke="#64748b" stroke-width="4"/><rect x="395" y="38" width="135" height="88" rx="12" fill="#047857"/><text x="462.5" y="78" text-anchor="middle" fill="#fff" font-size="17" font-family="Arial, sans-serif" font-weight="700">Relocate</text><text x="462.5" y="102" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">Step 3</text><path d="M530 82h34" stroke="#64748b" stroke-width="4"/><path d="m556 72 12 10-12 10" fill="none" stroke="#64748b" stroke-width="4"/><rect x="575" y="38" width="135" height="88" rx="12" fill="#7c3aed"/><text x="642.5" y="78" text-anchor="middle" fill="#fff" font-size="17" font-family="Arial, sans-serif" font-weight="700">Review</text><text x="642.5" y="102" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">Step 4</text><text x="380" y="151" text-anchor="middle" fill="#475569" font-size="12" font-family="Arial, sans-serif">Use official sources and preserve what you relied on.</text></svg>