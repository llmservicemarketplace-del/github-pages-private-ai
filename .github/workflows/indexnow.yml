name: Notify IndexNow of changed pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Allow GitHub Pages to publish first
        run: sleep 75

      - name: Submit changed public pages
        env:
          INDEXNOW_KEY: 85f72197a8cf40c5bc160febf3db7a24
          SITE_HOST: yprivateai.com
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          before = "${{ github.event.before }}"
          after = "${{ github.sha }}"
          if before and before != "0000000000000000000000000000000000000000":
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", before, after], text=True
              ).splitlines()
          else:
              changed = ["compare-insurance-estimates.html"]

          urls = []
          for path in changed:
              if not path.endswith(".html") or not os.path.exists(path):
                  continue
              if path == "index.html":
                  public_path = ""
              elif path.endswith("/index.html"):
                  public_path = path[:-10]
              else:
                  public_path = path
              urls.append(f"https://{os.environ['SITE_HOST']}/{public_path}")

          urls = sorted(set(urls))
          if not urls:
              print("No changed public HTML pages to submit.")
              raise SystemExit(0)

          payload = json.dumps({
              "host": os.environ["SITE_HOST"],
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": (
                  f"https://{os.environ['SITE_HOST']}/"
                  f"{os.environ['INDEXNOW_KEY']}.txt"
              ),
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow response: {response.status}")
          print("Submitted URLs:")
          print("\n".join(urls))
          PY
