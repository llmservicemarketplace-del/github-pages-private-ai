name: Refresh settlement and FTC refund directory
on:
  push:
    paths:
      - 'data/settlements.json'
      - 'tools/update_settlements.py'
      - '.github/workflows/update-settlements.yml'
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: settlement-directory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate updater
        run: |
          python -m unittest discover -s tests/settlements -p 'test_*.py'
          node tests/settlements/core.test.cjs
      - name: Refresh verified sources and FTC directory
        id: refresh
        continue-on-error: true
        run: python tools/update_settlements.py
      - name: Save updated directory
        run: |
          git config user.name "NFCcop directory updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/settlements.json money-help/settlements-and-refunds.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh settlement and FTC refund directory"
            git push
          fi
      - name: Publish changed GitHub Pages content
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Report unavailable sources
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "One or more sources could not be checked. Existing listings were retained. Inspect the refresh log."
          exit 1
